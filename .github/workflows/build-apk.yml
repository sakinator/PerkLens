name: Build PerkLens APK & Run Regression Suite

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Regression Suite & Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Static Codebase & Symbol Auditor
        run: python3 tools/codebase_auditor.py

      - name: Run PerkLens Full Regression Test Suite
        run: python3 tools/run_regression_suite.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Release APK with Permanent Keystore Signature
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Locate and Prepare APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_output/PerkLens.apk \;
          ls -la release_output/

      - name: Upload PerkLens APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerkLens-Android-APK
          path: release_output/PerkLens.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: PerkLens ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release_output/PerkLens.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
