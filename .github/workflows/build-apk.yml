name: Build PerkLens APK & Run Regression Suite

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Regression Suite & Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Static Codebase & Symbol Auditor
        run: python3 tools/codebase_auditor.py

      - name: Run PerkLens Full Regression Test Suite
        run: python3 tools/run_regression_suite.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install and Provision Gradle 8.5
        run: |
          echo "Provisioning Gradle 8.5 with resilient multi-mirror fallback..."
          curl -fsSL --connect-timeout 8 --max-time 20 https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle-8.5-bin.zip \
            || curl -fsSL --connect-timeout 8 --max-time 35 https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip -o /tmp/gradle-8.5-bin.zip
          if [ -f /tmp/gradle-8.5-bin.zip ]; then
            sudo unzip -q -o /tmp/gradle-8.5-bin.zip -d /opt
            sudo ln -sf /opt/gradle-8.5/bin/gradle /usr/local/bin/gradle
          fi
          gradle --version

      - name: Build Release APK with Permanent Keystore Signature
        run: |
          gradle assembleRelease --stacktrace

      - name: Locate and Prepare APK Artifact
        run: |
          mkdir -p release_output
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} release_output/PerkLens.apk \;
          ls -la release_output/

      - name: Upload PerkLens APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerkLens-Android-APK
          path: release_output/PerkLens.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: PerkLens ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release_output/PerkLens.apk
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
