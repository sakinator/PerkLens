name: Build PerkLens APK & Run Regression Suite

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Regression Suite & Android APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Static Codebase & Symbol Auditor
        run: python3 tools/codebase_auditor.py

      - name: Run PerkLens Full Regression Test Suite
        run: python3 tools/run_regression_suite.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle via Action
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Ensure Gradle 8.x is Ready
        run: |
          if ! command -v gradle &> /dev/null; then
            echo "Gradle not in PATH, downloading Gradle 8.6..."
            wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip -O /tmp/gradle.zip || \
            curl -sSL https://downloads.gradle.org/distributions/gradle-8.6-bin.zip -o /tmp/gradle.zip
            sudo unzip -q -d /opt /tmp/gradle.zip
            echo "/opt/gradle-8.6/bin" >> $GITHUB_PATH
            export PATH="/opt/gradle-8.6/bin:$PATH"
          fi
          gradle --version

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerkLens-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: PerkLens ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
