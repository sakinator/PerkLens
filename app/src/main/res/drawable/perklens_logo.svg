<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient: Deep Obsidian & Cyber Black -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0E161C"/>
      <stop offset="60%" stop-color="#070A0F"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>

    <!-- Card Gradient: Deep Obsidian into Emerald & Electric Neon Green -->
    <linearGradient id="neonCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051C12"/>
      <stop offset="40%" stop-color="#003D1E"/>
      <stop offset="75%" stop-color="#007038"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <!-- Scalloped Badge Gradient: Warm Chartreuse / Lime Gold from reference -->
    <linearGradient id="scallopBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDF842"/>
      <stop offset="50%" stop-color="#D6E324"/>
      <stop offset="100%" stop-color="#B8C416"/>
    </linearGradient>

    <!-- Specular Sheen Gradient for Card -->
    <linearGradient id="cardSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" stop-opacity="0.35"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="badgeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Circular Outer App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Electric Neon Green Ambient Outer Border -->
  <rect width="506" height="506" x="3" y="3" rx="126" fill="none" stroke="#00E676" stroke-opacity="0.5" stroke-width="3" filter="url(#neonGlow)"/>
  <rect width="506" height="506" x="3" y="3" rx="126" fill="none" stroke="#00FF87" stroke-opacity="0.8" stroke-width="1.5"/>

  <!-- Subtle Perspective Credit Card Body in Neon Green & Obsidian -->
  <g transform="matrix(0.96 0 -0.06 0.98 32 40)">
    <!-- Card Drop Shadow -->
    <rect x="58" y="128" width="360" height="226" rx="22" fill="#000000" fill-opacity="0.6" filter="url(#neonGlow)"/>

    <!-- Main Card Body -->
    <rect x="50" y="118" width="360" height="226" rx="22" fill="url(#neonCardGrad)"/>

    <!-- Electric Neon Glowing Card Border -->
    <rect x="50" y="118" width="360" height="226" rx="22" fill="none" stroke="#00FF87" stroke-width="2.5" stroke-opacity="0.75" filter="url(#neonGlow)"/>

    <!-- Diagonal Specular Sheen across Card -->
    <path d="M 50,140 L 230,118 L 50,300 Z" fill="url(#cardSheen)"/>

    <!-- EMV Chip (Metallic Brass with Micro-Circuits) -->
    <rect x="88" y="162" width="48" height="38" rx="7" fill="#F4D03F" stroke="#9A7D0A" stroke-width="1.5"/>
    <line x1="88" y1="181" x2="136" y2="181" stroke="#7D6608" stroke-width="1.5"/>
    <line x1="104" y1="162" x2="104" y2="200" stroke="#7D6608" stroke-width="1.5"/>
    <line x1="120" y1="162" x2="120" y2="200" stroke="#7D6608" stroke-width="1.5"/>

    <!-- Contactless Radio Wave Arcs (Neon Mint Tinted) -->
    <path d="M 152 170 A 12 12 0 0 1 152 192" fill="none" stroke="#00FF87" stroke-opacity="0.9" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 159 164 A 20 20 0 0 1 159 198" fill="none" stroke="#00FF87" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 166 158 A 28 28 0 0 1 166 204" fill="none" stroke="#00FF87" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Modern Card Dots Placeholder -->
    <circle cx="94" cy="275" r="3.5" fill="#E2FDF2" fill-opacity="0.85"/>
    <circle cx="106" cy="275" r="3.5" fill="#E2FDF2" fill-opacity="0.85"/>
    <circle cx="118" cy="275" r="3.5" fill="#E2FDF2" fill-opacity="0.85"/>
    <circle cx="130" cy="275" r="3.5" fill="#E2FDF2" fill-opacity="0.85"/>

    <circle cx="150" cy="275" r="3.5" fill="#E2FDF2" fill-opacity="0.85"/>
    <circle cx="162" cy="275" r="3.5" fill="#E2FDF2" fill-opacity="0.85"/>
    <circle cx="174" cy="275" r="3.5" fill="#E2FDF2" fill-opacity="0.85"/>
    <circle cx="186" cy="275" r="3.5" fill="#E2FDF2" fill-opacity="0.85"/>

    <!-- App Name Embossed on Card -->
    <text x="88" y="316" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#00FF87" letter-spacing="2.5" filter="url(#neonGlow)">PERKLENS</text>
  </g>

  <!-- 🌟 Focal Point: Scalloped Offer Badge & Rounded Percentage (Matching Reference Image) -->
  <g transform="translate(356, 276) scale(1.18)" filter="url(#badgeShadow)">
    
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="82" fill="#D6E324" fill-opacity="0.25" filter="url(#neonGlow)"/>

    <!-- 10-Lobe Rounded Scallop Rosette (Mathematical Bezier curve matching reference badge) -->
    <path d="M 24.10,-74.18 C 30.37,-72.15 31.12,-56.50 37.62,-51.78 C 44.12,-47.05 59.23,-51.18 63.10,-45.85 C 66.98,-40.51 58.38,-27.42 60.87,-19.78 C 63.35,-12.14 78.00,-6.59 78.00,0.00 C 78.00,6.59 63.35,12.14 60.87,19.78 C 58.38,27.42 66.98,40.51 63.10,45.85 C 59.23,51.18 44.12,47.05 37.62,51.78 C 31.12,56.50 30.37,72.15 24.10,74.18 C 17.83,76.22 8.03,64.00 0.00,64.00 C -8.03,64.00 -17.83,76.22 -24.10,74.18 C -30.37,72.15 -31.12,56.50 -37.62,51.78 C -44.12,47.05 -59.23,51.18 -63.10,45.85 C -66.98,40.51 -58.38,27.42 -60.87,19.78 C -63.35,12.14 -78.00,6.59 -78.00,0.00 C -78.00,-6.59 -63.35,-12.14 -60.87,-19.78 C -58.38,-27.42 -66.98,-40.51 -63.10,-45.85 C -59.23,-51.18 -44.12,-47.05 -37.62,-51.78 C -31.12,-56.50 -30.37,-72.15 -24.10,-74.18 C -17.83,-76.22 -8.03,-64.00 -0.00,-64.00 C 8.03,-64.00 17.83,-76.22 24.10,-74.18 Z" 
          fill="url(#scallopBadgeGrad)" 
          stroke="#FFFFFF" 
          stroke-opacity="0.3"
          stroke-width="1.5"/>

    <!-- Rounded Geometric Percentage (%) Symbol Matching Reference Image -->
    <!-- Diagonal Slash with Rounded Pill Caps -->
    <line x1="13" y1="-29" x2="-13" y2="29" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>

    <!-- Upper-Left Hollow Circular Ring -->
    <circle cx="-23" cy="-14" r="13" fill="none" stroke="#FFFFFF" stroke-width="8.5"/>

    <!-- Lower-Right Hollow Circular Ring -->
    <circle cx="23" cy="14" r="13" fill="none" stroke="#FFFFFF" stroke-width="8.5"/>
  </g>
</svg>